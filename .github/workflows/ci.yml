name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.1
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
      - run: xcaddy build v2.11.4 --with github.com/get-convex/caddy-consul-upstreams=.
      - run: ./caddy list-modules | grep -Fx http.reverse_proxy.upstreams.consul
      - run: ./caddy adapt --config testdata/Caddyfile --adapter caddyfile
